apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio
spec:
  ingressClassName: traefik
  rules:
    - host: oisenhart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
    - host: www.oisenhart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  name: http
