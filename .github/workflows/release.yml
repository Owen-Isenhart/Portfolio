name: Build and publish portfolio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/owen-isenhart/portfolio:sha-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build production image
        env:
          NEXT_PUBLIC_GISCUS_REPO: ${{ vars.NEXT_PUBLIC_GISCUS_REPO }}
          NEXT_PUBLIC_GISCUS_REPO_ID: ${{ vars.NEXT_PUBLIC_GISCUS_REPO_ID }}
          NEXT_PUBLIC_GISCUS_CATEGORY: ${{ vars.NEXT_PUBLIC_GISCUS_CATEGORY }}
          NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}
          NEXT_PUBLIC_GISCUS_MAPPING: ${{ vars.NEXT_PUBLIC_GISCUS_MAPPING }}
        run: |
          args=()
          for name in NEXT_PUBLIC_GISCUS_{REPO,REPO_ID,CATEGORY,CATEGORY_ID,MAPPING}; do
            if [[ -n "${!name}" ]]; then
              args+=(--build-arg "$name")
            fi
          done
          docker build "${args[@]}" --tag "$IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" .

      - name: Test the production image
        run: |
          docker run --detach --name portfolio-test --read-only \
            --tmpfs /tmp:rw,mode=1777,size=32m \
            --tmpfs /app/.next/cache:rw,uid=1000,gid=1000,size=512m \
            --tmpfs /app/.next/server/route-cache:rw,uid=1000,gid=1000,size=64m \
            --publish 127.0.0.1:8080:8080 "$IMAGE"
          trap 'docker logs portfolio-test; docker rm -f portfolio-test' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 --fail --silent --show-error \
            http://127.0.0.1:8080/healthz
          ./scripts/verify-site.sh http://127.0.0.1:8080

      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE"
          reference="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          printf '### Deploy the tested image\n\n`make deploy IMAGE=%s`\n' "$reference" >> "$GITHUB_STEP_SUMMARY"

      - name: Export the tested image for homelab import
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/portfolio-image.tar" "$IMAGE"

      - name: Upload the homelab image archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portfolio-image
          path: ${{ runner.temp }}/portfolio-image.tar
          if-no-files-found: error
          retention-days: 30
